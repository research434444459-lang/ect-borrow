<header class="nav" role="banner">
  <div class="nav-wrap">
    <!-- ไป dashboard ตรง ๆ -->
    <a class="brand" [routerLink]="['/admin','dashboard']" aria-label="ไปยังหน้าแรกผู้ดูแล">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12h6L7 22l12-10h-6l4-8L5 12z"/></svg>
      </span>
      <div>
        <div class="title">ระบบยืมคืนอุปกรณ์ <span style="font-weight:600;color:#334155;">Beta</span></div>
        <div class="subtitle">Admin Console</div>
      </div>
    </a>

    <div class="spacer" aria-hidden="true"></div>

    <nav class="nav-links" aria-label="เมนูผู้ดูแล">
      <a [routerLink]="['/admin','dashboard']"
         routerLinkActive="primary"
         [routerLinkActiveOptions]="{ exact: true }">หน้าหลัก</a>

      <a routerLink="/admin/today">รายการวันนี้</a>

      <!-- ยังไม่มีหน้า inventory ฝั่งแอดมิน ใช้ requests แทนชั่วคราว -->
      <a routerLink="/admin/requests">จัดการคลัง</a>

      <a routerLink="/admin/requests">จัดการคำขอ</a>

      <button type="button" class="logout" (click)="logout()">ออกจากระบบ</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="intro">เลือกเมนูที่ต้องการดำเนินการ</p>

  <section class="grid">
    <a class="card-link" routerLink="/admin/today" routerLinkActive="router-link-active">
      <div class="thumb">📅</div>
      <div class="card-text">
        <div class="card-title">รายการขอยืมวันนี้</div>
        <div class="card-desc">ตรวจสอบและยืนยันคำขอที่มีกำหนดรับวันนี้</div>
      </div>
    </a>

    <!-- เปลี่ยนปลายทางชั่วคราวให้ใช้งานได้แน่ ๆ -->
    <a class="card-link" routerLink="/admin/requests">
      <div class="thumb">📦</div>
      <div class="card-text">
        <div class="card-title">จัดการคลังอุปกรณ์</div>
        <div class="card-desc">เพิ่ม/แก้ไขรายการอุปกรณ์ เช็คจำนวนคงเหลือ</div>
      </div>
    </a>

    <a class="card-link" routerLink="/admin/requests">
      <div class="thumb">📝</div>
      <div class="card-text">
        <div class="card-title">จัดการคำขออุปกรณ์</div>
        <div class="card-desc">อนุมัติ/ปฏิเสธ อัปเดตสถานะ และเพิ่มหมายเหตุ</div>
      </div>
    </a>
  </section>
</main>
